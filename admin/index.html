<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In — NextPay 7</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body style="background: var(--color-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div style="background: #FFFFFF; border-radius: var(--radius-lg); width: 100%; max-width: 420px; padding: 40px; box-shadow: var(--shadow-lg); text-align: center;">
    <img src="../assets/images/logo.jpeg" alt="NextPay 7 Logo" style="height: 54px; margin-bottom: 16px; object-fit: contain;">
    <h1 style="font-size: 24px; color: var(--color-primary); margin-bottom: 4px;">Staff & Admin Portal</h1>
    <p style="font-size: 13px; color: var(--color-text-muted); margin-bottom: 24px;">
      Sign in with your administrator credentials to manage NextPay 7.
    </p>

    <div id="login-error-alert" style="display: none; background: var(--color-danger-bg); color: var(--color-danger); padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; text-align: left;"></div>

    <form id="admin-login-form" style="text-align: left;">
      <div style="margin-bottom: 16px;">
        <label for="admin-email" style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--color-text-main);">Email Address</label>
        <input type="email" id="admin-email" required class="search-input" style="border-radius: var(--radius-md);" placeholder="admin@nextbuy77.com">
      </div>
      <div style="margin-bottom: 24px;">
        <label for="admin-password" style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--color-text-main);">Password</label>
        <input type="password" id="admin-password" required class="search-input" style="border-radius: var(--radius-md);" placeholder="••••••••••••">
      </div>
      <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block" style="font-size: 15px;">
        Sign In to Admin Panel
      </button>
    </form>

    <div style="margin-top: 24px; font-size: 12px; color: var(--color-text-light);">
      &copy; 2026 NextPay 7. Protected Management System.
    </div>
  </div>

  <script type="module">
    import { adminAuth } from './js/admin-auth.js';

    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const btn = document.getElementById('login-submit-btn');
      const errorAlert = document.getElementById('login-error-alert');

      errorAlert.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Verifying Credentials...';

      try {
        await adminAuth.login(email, password);
      } catch (err) {
        errorAlert.style.display = 'block';
        errorAlert.textContent = err.message || 'Invalid administrator credentials.';
        btn.disabled = false;
        btn.textContent = 'Sign In to Admin Panel';
      }
    });
  </script>
</body>
</html>
